name: Twitter to Telegram
on:
  workflow_dispatch:
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install requests -q
          python - << 'PY'
          import requests
          BOT="8520671007:AAG-gmwnuvzTWOL_7ZsA1h5KCqetYrDt95A"
          CH="@alha64"
          r=requests.post(f"https://api.telegram.org/bot{BOT}/sendMessage",data={"chat_id":CH,"text":"✅ تم ربط البوت بالقناة بنجاح @alha64\n\nالآن بجرب أجيب تغريدة..."})
          print("TEST:",r.text)
          try:
              j=requests.get("https://api.vxtwitter.com/hilalstuff",headers={"User-Agent":"Mozilla/5.0"},timeout=20).json()
              txt=j.get('tweets',[{}])[0].get('text') or j.get('timeline',[{}])[0].get('text') or "ما لقيت تغريدة"
          except Exception as e:
              txt=f"خطأ في الجلب: {e}"
          import re
          txt=re.sub(r'https?://\S+','',txt).strip()
          requests.post(f"https://api.telegram.org/bot{BOT}/sendMessage",data={"chat_id":CH,"text":txt+"\n\n@alha64"})
          print("SENT TWEET:",txt[:200])
          PY
